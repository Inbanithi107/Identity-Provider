<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Authentication Code</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            padding:20px;
        }

        .card{
            width:100%;
            max-width:500px;
            background:#fff;
            border-radius:20px;
            padding:40px;
            text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,.25);
            animation:fadeIn .5s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .shield{
            width:90px;
            height:90px;
            border-radius:50%;
            margin:auto;
            margin-bottom:20px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:42px;
            color:white;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
        }

        h1{
            color:#222;
            margin-bottom:15px;
        }

        p{
            color:#666;
            line-height:1.6;
            margin-bottom:30px;
        }

        .otp-container{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:30px;
        }

        .otp-input{
            width:55px;
            height:60px;
            border:2px solid #d1d5db;
            border-radius:10px;
            text-align:center;
            font-size:24px;
            font-weight:bold;
            transition:.25s;
        }

        .otp-input:focus{
            outline:none;
            border-color:#2563eb;
            box-shadow:0 0 0 3px rgba(37,99,235,.15);
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:15px;
        }

        button{
            border:none;
            cursor:pointer;
            padding:14px 28px;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            transition:.3s;
        }

        .verify-btn{
            background:#2563eb;
            color:white;
        }

        .verify-btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        .back-btn{
            background:#f3f4f6;
        }

        .back-btn:hover{
            background:#e5e7eb;
        }

        .loading{
            display:none;
            margin-top:25px;
        }

        .spinner{
            width:45px;
            height:45px;
            border:5px solid #ddd;
            border-top:5px solid #2563eb;
            border-radius:50%;
            margin:auto;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            100%{
                transform:rotate(360deg);
            }
        }

        #error{
            color:#dc2626;
            margin-top:18px;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="shield">🔐</div>

    <h1>Verify Authentication Code</h1>

    <p>
        Enter the 6-digit code generated by your Authenticator app.
    </p>

    <form id="otpForm">

        <div class="otp-container">

            <input class="otp-input" maxlength="1" inputmode="numeric">
            <input class="otp-input" maxlength="1" inputmode="numeric">
            <input class="otp-input" maxlength="1" inputmode="numeric">
            <input class="otp-input" maxlength="1" inputmode="numeric">
            <input class="otp-input" maxlength="1" inputmode="numeric">
            <input class="otp-input" maxlength="1" inputmode="numeric">

        </div>

        <div class="buttons">
            <button type="submit" class="verify-btn">Verify</button>
            <button type="button" class="back-btn" onclick="history.back()">Back</button>
        </div>

    </form>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top:20px;">Verifying code...</p>
    </div>

    <div id="error"></div>

</div>

<script>

    const inputs = document.querySelectorAll(".otp-input");

    inputs.forEach((input,index)=>{

        input.addEventListener("input",()=>{

            input.value = input.value.replace(/\D/g,'');

            if(input.value && index < inputs.length-1){
                inputs[index+1].focus();
            }

        });

        input.addEventListener("keydown",(e)=>{

            if(e.key==="Backspace" && !input.value && index>0){
                inputs[index-1].focus();
            }

        });

    });

    document.getElementById("otpForm").addEventListener("submit",async function(e){

        e.preventDefault();

        const code = [...inputs].map(i=>i.value).join("");

        if(code.length!==6){

            document.getElementById("error").textContent="Please enter the 6-digit code.";
            return;

        }

        document.getElementById("error").textContent="";
        document.getElementById("loading").style.display="block";

        try{

            const response = await fetch("/totp/verify",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    code:code
                })

            });

            document.getElementById("loading").style.display="none";
            const res = await response.json();
            window.location.href = res.redirect;

            document.getElementById("error").textContent="Invalid verification code.";

        }catch(err){

            document.getElementById("loading").style.display="none";
            document.getElementById("error").textContent="Something went wrong.";

        }

    });

</script>

</body>
</html>
